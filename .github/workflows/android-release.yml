name: Build Viht Admin APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref_name == 'private-android-2.0.0.4-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIHT_TEST_KEYSTORE: ${{ github.workspace }}/.viht-test-signing.keystore
      VIHT_TEST_SIGNING_KEYSTORE: ${{ secrets.VIHT_TEST_SIGNING_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build admin interface
        working-directory: web
        run: |
          npm ci
          npx --no-install vite build --config vite.admin.config.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore and verify persistent signing key
        run: |
          test -n "$VIHT_TEST_SIGNING_KEYSTORE"
          printf '%s' "$VIHT_TEST_SIGNING_KEYSTORE" | base64 --decode > "$VIHT_TEST_KEYSTORE"
          chmod 600 "$VIHT_TEST_KEYSTORE"
          actual=$(keytool -exportcert -keystore "$VIHT_TEST_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)
          test "$actual" = d0b6089540fa9af2a4a0a6b99140ca7f168c70e05df849b5abef4bed51fb1d66
      - name: Build Viht Admin
        run: |
          chmod +x gradlew
          ./gradlew :admin-app:lintDebug :admin-app:assembleDebug --console=plain -PciVersionCode="$GITHUB_RUN_NUMBER"
      - name: Launch Viht Admin on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke-admin.sh
      - name: Verify and encrypt APK
        run: |
          mkdir release-admin
          apk=release-admin/Viht-Admin-2.0.0.5.test.apk
          cp admin-app/build/outputs/apk/debug/admin-app-debug.apk "$apk"
          analyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$analyzer" manifest application-id "$apk")" = ru.anviht.admin.test
          test "$("$analyzer" manifest version-name "$apk")" = 2.0.0.5.test
          test "$("$analyzer" manifest version-code "$apk")" = "$GITHUB_RUN_NUMBER"
          "$analyzer" manifest print "$apk" > release-admin/manifest.xml
          if grep -E 'VpnService|BIND_VPN_SERVICE' release-admin/manifest.xml; then exit 1; fi
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose --print-certs "$apk" > release-admin/signature.txt
          grep -F 'd0b6089540fa9af2a4a0a6b99140ca7f168c70e05df849b5abef4bed51fb1d66' release-admin/signature.txt
          (cd release-admin && sha256sum *.apk > SHA256SUMS.txt)
          tar -czf release-admin.tgz -C release-admin .
          node tools/encrypt-private-apk.cjs release-admin.tgz Viht-Admin.enc tools/viht-admin-artifact-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: Viht-Admin-encrypted
          path: Viht-Admin.enc
          if-no-files-found: error
          retention-days: 1
