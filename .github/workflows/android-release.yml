name: Build Viht VPN APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Android universal test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test shared interface
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"
      - uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-3a706062e1b3e804ca7f7abbdef523a05c4ad7c125ab1496e2b0a52a62c360a5
      - name: Verify pinned VPN core
        run: node tools/fetch-libbox.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: viht-android-test-signing-v1
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew verifyLibbox testDebugUnitTest lintDebug assembleDebug --console=plain --stacktrace -PciVersionCode=$((1000 + GITHUB_RUN_NUMBER))
      - name: Prepare universal APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/VihtVPN-1.4.0-test-universal.apk
          sha256sum release-apk/*.apk > release-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VihtVPN-Android-test
          path: release-apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
