name: Build Viht VPN APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Viht VPN APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0"

      - name: Ensure libbox.aar
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libbox.aar ] || [ $(wc -c < app/libs/libbox.aar) -lt 1000 ]; then
            echo "Downloading libbox.aar from LFS..."
            node -e "
              const fs = require('fs');
              const https = require('https');
              async function run() {
                const resp = await fetch('https://github.com/scripchenko/pingwin.git/info/lfs/objects/batch', {
                  method: 'POST',
                  headers: { 'Accept': 'application/vnd.git-lfs+json', 'Content-Type': 'application/vnd.git-lfs+json' },
                  body: JSON.stringify({ operation: 'download', transfers: ['basic'], objects: [{ oid: '3a706062e1b3e804ca7f7abbdef523a05c4ad7c125ab1496e2b0a52a62c360a5', size: 92997417 }] })
                });
                const data = await resp.json();
                const downloadUrl = data.objects[0].actions.download.href;
                const file = fs.createWriteStream('app/libs/libbox.aar');
                await new Promise((resolve, reject) => {
                  https.get(downloadUrl, res => {
                    res.pipe(file);
                    file.on('finish', () => { file.close(); resolve(); });
                  }).on('error', reject);
                });
                console.log('libbox.aar downloaded and verified');
              }
              run().catch(e => { console.error(e); process.exit(1); });
            "
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify libbox SHA-256
        run: ./gradlew verifyLibbox --console=plain

      - name: Build Optimized Single APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Organize Single APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/VihtVPN.apk
          ls -la release-apk/

      - name: Upload Single APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VihtVPN-Android
          path: release-apk/VihtVPN.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.4
          name: "Viht VPN Android v1.3.4 (Syntax Hotfix)"
          files: release-apk/VihtVPN.apk
          generate_release_notes: true
