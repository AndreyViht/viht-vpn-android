name: Diagnose published APK installation
on:
  push:
    branches: [diagnostics/published-apk-install]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Download immutable published APK and verify digest
        run: |
          curl -fL --retry 2 https://anviht.ru/download/VihtVPN-Android-1.4.28-test.apk -o published.apk
          curl -fL https://anviht.ru/download/android-test-latest.json -o feed.json
          python3 - <<'PY'
          import json,hashlib
          a=json.load(open('feed.json'))['assets'][0]
          assert a['name']=='VihtVPN-Android-1.4.28-test.apk'
          assert 'sha256:'+hashlib.sha256(open('published.apk','rb').read()).hexdigest()==a['digest']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: adb install --no-streaming published.apk && adb shell pm path ru.anviht.vpn.test
      - name: Save package manager diagnostics
        if: always()
        run: adb logcat -d -v threadtime > package-manager.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-manager-${{ matrix.api }}
          path: package-manager.txt
