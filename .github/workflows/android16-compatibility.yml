name: Android 16 published APK compatibility
on:
  push:
    branches: [diagnostics/android16-install]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Download published APK
        run: |
          curl --fail --location --retry 3 'https://anviht.ru/download/VihtVPN-Android-1.4.20-test.apk' -o viht.apk
          echo 'a56add3f280e4d332cbbdeba2393780bf6d3d35e2dbfa7eb6cfd7e108f004af7  viht.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fresh installation and launch on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r viht.apk | tee install-result.txt
            adb shell am start -W -n ru.anviht.vpn.test/com.pingwin.vpn.MainActivity | tee launch-result.txt
            sleep 10
            adb shell pidof ru.anviht.vpn.test | tee process-result.txt
            adb logcat -b crash -d > crash-result.txt
            test -s process-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android16-install-diagnostics
          path: '*-result.txt'
