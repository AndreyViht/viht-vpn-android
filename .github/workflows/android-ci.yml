name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0"

      - name: Ensure libbox.aar
        run: |
          mkdir -p app/libs
          if [ ! -s app/libs/libbox.aar ] || [ $(wc -c < app/libs/libbox.aar) -lt 1000 ]; then
            echo "Downloading libbox.aar from LFS..."
            node -e "
              const fs = require('fs');
              const https = require('https');
              fetch('https://github.com/scripchenko/pingwin.git/info/lfs/objects/batch', {
                method: 'POST',
                headers: { 'Accept': 'application/vnd.git-lfs+json', 'Content-Type': 'application/vnd.git-lfs+json' },
                body: JSON.stringify({ operation: 'download', transfers: ['basic'], objects: [{ oid: '3a706062e1b3e804ca7f7abbdef523a05c4ad7c125ab1496e2b0a52a62c360a5', size: 92997417 }] })
              }).then(r => r.json()).then(d => {
                const url = d.objects[0].actions.download.href;
                const file = fs.createWriteStream('app/libs/libbox.aar');
                https.get(url, r => {
                  r.pipe(file);
                  file.on('finish', () => console.log('libbox.aar downloaded successfully'));
                });
              });
            "
            sleep 15
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify and build
        run: ./gradlew verifyLibbox assembleDebug --console=plain --stacktrace