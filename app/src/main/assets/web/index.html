<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Viht VPN</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07090E;
        color: #FFFFFF;
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <!-- Global Error Catcher -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('[VihtApp Global Error]', e.message, e.filename, e.lineno);
        var errBox = document.getElementById('viht-fatal-error');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'viht-fatal-error';
          errBox.style = 'position:fixed;bottom:16px;left:16px;right:16px;background:rgba(239,68,68,0.95);color:#fff;padding:14px;border-radius:12px;font-size:12px;z-index:999999;word-break:break-all;font-family:monospace;box-shadow:0 10px 30px rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.2);';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = '<b>Ошибка запуска интерфейса:</b><br>' + (e.message || 'Unknown error') + '<br><small style="opacity:0.8">' + (e.filename || '') + ':' + (e.lineno || 0) + '</small>';
      });
    </script>
    <!-- Bridge for Android -->
    <script src="./android-bridge.js"></script>
    <link rel="stylesheet" href="./assets/index-eKdXdjK_.css">
    <!-- Non-module script tag so Chromium never blocks it on file:// or appassets -->
    <script defer src="./assets/index-74jFdvMR.js"></script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;background:#07090E;color:#00D2FF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;gap:20px;padding:24px;text-align:center;">
        <div style="width:54px;height:54px;border:3px solid #12192A;border-top-color:#00D2FF;border-right-color:#7000FF;border-radius:50%;animation:viht-spin 0.85s linear infinite;box-shadow:0 0 24px rgba(0,210,255,0.35);"></div>
        <div style="font-size:16px;font-weight:700;letter-spacing:0.8px;color:#F8FAFC;">Viht VPN</div>
        <div style="font-size:13px;color:#64748B;">Инициализация защищённой сети...</div>
      </div>
      <style>
        @keyframes viht-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </body>
</html>
